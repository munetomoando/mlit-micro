<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミクロ経済学 100ステップ — 自律学習ドリル</title>
<meta name="author" content="安藤至大">
<meta name="description" content="安藤至大（2021）『ミクロ経済学の第一歩（新版）』有斐閣 に基づく復習用サイト。ミクロ経済学を100の小さなステップに分けて、一つずつ確実に理解を積み上げます。進捗は自動保存されます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0095D9; --primary-dark:#005C8A; --primary-light:#E8F4FD; --primary-pale:#F4F9FD;
  --accent:#F39800; --accent-light:#FFF4E2;
  --ok:#1F8A5B; --ok-light:#E6F5EE; --ng:#C0392B; --ng-light:#FCECEA;
  --bg:#FFFFFF; --surface:#FCFCFB; --panel:#F5F8FA; --border:#D3DFE8; --border-soft:#E6EDF2;
  --ink:#22282C; --ink-2:#4A555C; --ink-3:#79868E;
  /* 図の配色は講義資料（20260825）と揃える。消費者側＝オレンジ、生産者側＝青。
     UI の --accent / --ok / --ng とは用途を分けており、図の中には持ち込まない */
  --c-demand:#E58000; --c-supply:#1F3FE0;
  --c-cs:#B86B00; --c-ps:#1B3FD0; --c-gov:#8A6BBF; --c-dwl:#5A5754;
  --serif:'Noto Serif JP',"Hiragino Mincho ProN",serif;
  --sans:'Noto Sans JP',"Hiragino Sans","Yu Gothic",sans-serif;
  --r:10px; --hdr-h:5.4rem;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip;font-size:clamp(14.5px,12.1px + 0.31vw,18.5px)}
body{font-family:var(--sans);color:var(--ink);background:var(--panel);line-height:1.85;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;line-height:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ============ ヘッダー ============ */
.hdr{position:fixed;inset:0 0 auto 0;background:#fff;border-bottom:2px solid var(--primary);z-index:200;
  box-shadow:0 1px 10px rgba(0,80,140,.07)}
.hdr-in{max-width:64rem;margin:0 auto;padding:.5rem .9rem .45rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.28;flex:none}
.brand b{font-family:var(--serif);font-size:.98rem;color:var(--primary-dark);white-space:nowrap}
.brand span{font-size:.66rem;color:var(--ink-3);letter-spacing:.02em}
.src-h{flex:0 1 auto;min-width:0;font-size:.72rem;color:var(--ink-3);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-acts{margin-left:auto;display:flex;gap:.35rem;flex:none}
.hbtn{display:flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:99px;font-size:.76rem;font-weight:700;
  color:var(--primary-dark);background:var(--primary-light);white-space:nowrap}
.hbtn:hover{background:#D5EBFA}
.hbtn.on{background:var(--primary-dark);color:#fff}
.prog{flex:1 1 100%;display:flex;align-items:center;gap:.6rem;min-width:0}
.bar{flex:1;height:.55rem;background:var(--border-soft);border-radius:99px;overflow:hidden;min-width:4rem}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--primary),#38B6E8);
  transition:width .45s cubic-bezier(.4,0,.2,1)}
.prog-t{font-size:.74rem;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog-t b{color:var(--primary-dark);font-size:.92rem}

/* ============ レイアウト ============ */
main{max-width:52rem;margin:0 auto;padding:calc(var(--hdr-h) + 1.1rem) 1rem 5rem}
/* 出典表示。どの画面でも本文の上に出る */
.src{margin:0 0 1.1rem;padding:.6rem .95rem;background:var(--primary-pale);
  border:1px solid var(--border-soft);border-left:3px solid var(--primary);border-radius:0 6px 6px 0;
  font-size:.8rem;color:var(--ink-2);line-height:1.8}
.src b{font-family:var(--serif);font-weight:700;color:var(--primary-dark)}
/* 出典は広い画面ではヘッダー内、狭い画面では本文の上。同時には出さない。 */
.src-h{display:none}
@media (min-width:50rem){ .src-h{display:block} .src{display:none} }
.src a,.src-h a,footer a{color:var(--primary-dark);text-decoration:underline;text-underline-offset:.18em;
  text-decoration-color:#A9CFE8;text-decoration-thickness:1px}
.src a:hover,.src-h a:hover,footer a:hover{text-decoration-color:var(--primary)}
.view[hidden]{display:none}

/* ============ ステップカード ============ */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:1.5rem 1.5rem 1.2rem;
  box-shadow:0 1px 3px rgba(0,60,110,.05)}
.st-head{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.7rem}
.st-no{font-size:.76rem;font-weight:900;color:#fff;background:var(--primary-dark);padding:.16rem .6rem;border-radius:99px;
  letter-spacing:.03em;font-variant-numeric:tabular-nums}
.st-ch{font-size:.74rem;font-weight:700;color:var(--primary-dark);background:var(--primary-light);padding:.16rem .6rem;border-radius:99px}
.st-done{font-size:.74rem;font-weight:700;color:var(--ok);background:var(--ok-light);padding:.16rem .6rem;border-radius:99px}
h1.st-title{font-family:var(--serif);font-size:1.5rem;line-height:1.45;color:var(--primary-dark);margin-bottom:.9rem;
  letter-spacing:.01em}
.goal{background:var(--primary-pale);border-left:4px solid var(--primary);border-radius:0 6px 6px 0;
  padding:.6rem .9rem;margin-bottom:1.2rem}
.goal b{display:block;font-size:.7rem;color:var(--primary-dark);letter-spacing:.08em;margin-bottom:.05rem}
.goal p{font-size:.95rem;font-weight:500;line-height:1.7}

/* 本文 */
.body p{margin-bottom:.85rem}
.body p:last-child{margin-bottom:0}
.body ul{margin:0 0 .9rem;padding-left:1.3rem}
.body li{margin-bottom:.3rem}
.body b{font-weight:700;color:var(--primary-dark)}
.term{font-weight:700;color:var(--accent);border-bottom:2px solid #FBDCA9;padding-bottom:.05em}
.note{background:var(--accent-light);border:1px solid #F5D9A8;border-radius:8px;padding:.7rem .95rem;margin:.9rem 0;font-size:.94rem}
/* 見出しになるのは先頭の <b> だけ。文中の強調まで block にすると文が分断される */
.note>b:first-child{display:block;color:#A66200;font-size:.82rem;margin-bottom:.15rem}
.note b{color:inherit}
table.t{width:100%;border-collapse:collapse;margin:.9rem 0;font-size:.9rem}
table.t th,table.t td{border:1px solid var(--border);padding:.4rem .6rem;text-align:left;vertical-align:top}
table.t th{background:var(--panel);font-weight:700;color:var(--primary-dark);white-space:nowrap}

/* 図 */
figure.figwrap{margin:1.1rem 0;background:var(--surface);border:1px solid var(--border-soft);border-radius:8px;padding:.7rem .7rem .5rem}
svg.fig{display:block;width:100%;height:auto;max-width:30rem;margin:0 auto}
svg.fig .ax{stroke:var(--ink-2);stroke-width:1.4}
svg.fig .gl{stroke:var(--border);stroke-width:1;stroke-dasharray:3 3}
svg.fig .d{stroke:var(--c-demand);stroke-width:2.4;fill:none}
svg.fig .s{stroke:var(--c-supply);stroke-width:2.4;fill:none}
svg.fig .d2,svg.fig .s2{stroke-width:2.2;fill:none;stroke-dasharray:6 4}
svg.fig .d2{stroke:var(--c-demand);opacity:.75}
svg.fig .s2{stroke:var(--c-supply);opacity:.75}
svg.fig .aux{stroke:var(--c-gov);stroke-width:2.2;fill:none}
svg.fig text{font-family:var(--sans);font-size:10.5px;fill:var(--ink-2)}
svg.fig .axl{font-size:10px;fill:var(--ink-3)}
svg.fig .lb{font-weight:700;font-size:11px}
svg.fig .lbd{fill:var(--c-demand);font-weight:700;font-size:11px}
svg.fig .lbs{fill:var(--c-supply);font-weight:700;font-size:11px}
svg.fig .lbx{fill:var(--c-gov);font-weight:700;font-size:11px}
svg.fig .box{fill:#fff;stroke:var(--border);stroke-width:1.2}
figcaption{font-size:.78rem;color:var(--ink-3);text-align:center;margin-top:.35rem;line-height:1.6}

/* ============ 確認問題 ============ */
.quiz{margin-top:1.5rem;border-top:2px dashed var(--border);padding-top:1.2rem}
.quiz-h{display:flex;align-items:center;gap:.45rem;font-size:.72rem;font-weight:900;color:var(--primary-dark);
  letter-spacing:.1em;margin-bottom:.55rem}
.quiz-h::before{content:"";width:.85rem;height:.85rem;border-radius:3px;background:var(--primary)}
.q{margin-bottom:1.5rem}
.q:last-child{margin-bottom:0}
.q-t{font-weight:700;font-size:1.02rem;line-height:1.7;margin-bottom:.7rem}
.ch-list{display:flex;flex-direction:column;gap:.45rem}
.ch-btn{display:flex;gap:.6rem;align-items:flex-start;text-align:left;width:100%;padding:.6rem .8rem;
  border:1.5px solid var(--border);border-radius:8px;background:#fff;transition:background .15s,border-color .15s}
.ch-btn:hover:not(:disabled){border-color:var(--primary);background:var(--primary-pale)}
.ch-btn .mk{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--panel);color:var(--ink-2);
  display:grid;place-items:center;font-size:.8rem;font-weight:900}
.ch-btn .tx{flex:1;font-size:.95rem;line-height:1.65}
.ch-btn.pick-ok{border-color:var(--ok);background:var(--ok-light)}
.ch-btn.pick-ok .mk{background:var(--ok);color:#fff}
.ch-btn.pick-ng{border-color:var(--ng);background:var(--ng-light)}
.ch-btn.pick-ng .mk{background:var(--ng);color:#fff}
.ch-btn.rev-ok{border-color:var(--ok)}
.ch-btn.rev-ok .mk{background:var(--ok);color:#fff}
.why{font-size:.88rem;line-height:1.75;margin:.35rem 0 .1rem;padding:.5rem .75rem;border-radius:6px;background:var(--panel);color:var(--ink-2)}
.why.ok{background:var(--ok-light);color:#14603F}
.why.ng{background:var(--ng-light);color:#8E2A1E}
.q-res{margin-top:.7rem;font-weight:700;font-size:.92rem;padding:.5rem .8rem;border-radius:6px}
.q-res.ok{background:var(--ok-light);color:var(--ok)}
.q-res.ng{background:var(--ng-light);color:var(--ng)}

/* ============ ナビ ============ */
.nav{display:flex;align-items:center;gap:.6rem;margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--border-soft)}
.nbtn{padding:.55rem 1.1rem;border-radius:99px;font-weight:700;font-size:.92rem;background:var(--panel);
  color:var(--primary-dark);border:1.5px solid var(--border)}
.nbtn:hover:not(:disabled){background:var(--primary-light);border-color:var(--primary)}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.nbtn.pri{background:var(--primary);color:#fff;border-color:var(--primary);margin-left:auto}
.nbtn.pri:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.mark{font-size:.8rem;font-weight:700;color:var(--ink-3);padding:.4rem .7rem;border-radius:99px;border:1.5px dashed var(--border)}
.mark:hover{color:var(--ok);border-color:var(--ok)}
.mark.on{color:var(--ok);border-style:solid;border-color:var(--ok);background:var(--ok-light)}

/* ============ 一覧（ドットマップ） ============ */
.mp-h{font-family:var(--serif);font-size:1.25rem;color:var(--primary-dark);margin-bottom:.2rem}
.mp-sub{font-size:.84rem;color:var(--ink-3);margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:.32rem;margin-bottom:1.4rem}
.cell{aspect-ratio:1;border-radius:5px;background:var(--border-soft);color:var(--ink-3);font-size:.66rem;font-weight:700;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:transform .12s,background .2s;
  border:1.5px solid transparent}
.cell:hover{transform:scale(1.14);z-index:2}
.cell.done{background:var(--primary);color:#fff}
.cell.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.cell.chs{box-shadow:inset 2px 0 0 var(--accent)}
.cell.chs.cur{box-shadow:inset 2px 0 0 var(--accent),0 0 0 2px var(--accent-light)}
.lgd{display:flex;gap:1rem;flex-wrap:wrap;font-size:.74rem;color:var(--ink-3);margin:-1rem 0 1.4rem}
.lgd i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;vertical-align:-1px;margin-right:.25rem}
.chs-list{display:flex;flex-direction:column;gap:.4rem}
.chrow{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.55rem .8rem;background:#fff;
  border:1px solid var(--border);border-radius:8px}
.chrow:hover{border-color:var(--primary);background:var(--primary-pale)}
.chrow .cn{flex:none;font-size:.7rem;font-weight:900;color:var(--primary-dark);background:var(--primary-light);
  border-radius:99px;padding:.12rem .5rem}
.chrow .ct{flex:1;font-size:.92rem;font-weight:700;min-width:0}
.chrow .cb{flex:none;width:5rem;height:.4rem;border-radius:99px;background:var(--border-soft);overflow:hidden}
.chrow .cb>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.chrow .cc{flex:none;font-size:.74rem;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:2.9rem;text-align:right}
.chrow.full .cc{color:var(--ok)}
.mp-foot{margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--border);display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.mini{font-size:.76rem;color:var(--ink-3)}
.danger{font-size:.76rem;font-weight:700;color:var(--ng);border:1.5px solid #EBC3BD;border-radius:99px;padding:.3rem .8rem}
.danger:hover{background:var(--ng-light)}

/* ============ トースト ============ */
.toast{position:fixed;left:50%;bottom:1.6rem;transform:translate(-50%,140%);z-index:400;
  background:var(--primary-dark);color:#fff;padding:.75rem 1.3rem;border-radius:99px;font-weight:700;font-size:.92rem;
  box-shadow:0 6px 24px rgba(0,60,110,.28);transition:transform .4s cubic-bezier(.2,.9,.3,1.2);max-width:min(90vw,28rem);
  text-align:center;line-height:1.6}
.toast.show{transform:translate(-50%,0)}
.toast.gold{background:linear-gradient(135deg,#E08900,#F5AD3A)}

/* ============ お祝いの演出（花火・紙吹雪） ============ */
/* トースト（z-index 400）より下、ヘッダー（200）より上。クリックは下の要素に通す。 */
#fwCanvas,#cfCanvas{position:fixed;inset:0;z-index:350;pointer-events:none}

footer{max-width:52rem;margin:0 auto;padding:0 1rem 2.5rem;font-size:.74rem;color:var(--ink-3);line-height:1.8}

@media (max-width:34rem){
  :root{--hdr-h:5.1rem}
  .card{padding:1.1rem 1rem 1rem}
  h1.st-title{font-size:1.28rem}
  .grid{grid-template-columns:repeat(5,1fr);gap:.4rem}
  .cell{font-size:.78rem}
  .nav{flex-wrap:wrap}
  .nbtn.pri{width:100%;margin-left:0;order:9;text-align:center}
  .chrow .cb{width:3rem}
  .brand span{display:none}
}
@media print{.hdr,.nav,.mp-foot{display:none}main{padding-top:1rem}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand"><b>ミクロ経済学 100ステップ</b><span>自律学習ドリル</span></div>
    <p class="src-h"><a href="https://www.yuhikaku.co.jp/book/b10189589.html" target="_blank" rel="noopener">安藤至大（2021）『ミクロ経済学の第一歩（新版）』有斐閣</a>の復習用サイト</p>
    <div class="hdr-acts">
      <button class="hbtn" id="btnMap">▦ 一覧</button>
      <button class="hbtn" id="btnResume">▶ 続きから</button>
    </div>
    <div class="prog">
      <div class="bar"><i id="barIn"></i></div>
      <div class="prog-t"><b id="pDone">0</b> / 100 完了（<span id="pPct">0</span>%）</div>
    </div>
  </div>
</header>

<main>
  <p class="src">このサイトは、<b><a href="https://www.yuhikaku.co.jp/book/b10189589.html" target="_blank" rel="noopener">安藤至大（2021）『ミクロ経済学の第一歩（新版）』有斐閣</a></b>に基づく復習用の教材です。</p>
  <section class="view" id="viewStep"></section>
  <section class="view" id="viewMap" hidden></section>
</main>

<footer>
  <p>ミクロ経済学 100ステップ — 自律学習ドリル｜安藤至大</p>
  <p>このサイトは、<a href="https://www.yuhikaku.co.jp/book/b10189589.html" target="_blank" rel="noopener">安藤至大（2021）『ミクロ経済学の第一歩（新版）』有斐閣</a>に基づく復習用の教材です。</p>
  <p>学習の進み具合はこのブラウザに自動保存されます。別の端末やブラウザには引き継がれません。</p>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ================= ステップデータ ================= */
window.STEPS_C1 = [
{
  n: 1,
  ch: 1,
  title: "ミクロ経済学は何を考える学問か",
  goal: "ミクロ経済学がどのような問いを扱う学問なのかを、自分の言葉で説明できる",
  body: `<p>ミクロ経済学は、<span class="term">消費者</span>や<span class="term">企業</span>といった意思決定を行う主体の行動を分析し、その積み重ねが取引や社会全体にどのような影響を与えるのかを考える学問です。財政学、公共経済学、労働経済学、環境経済学、都市経済学など、応用分野のすべての土台になっています。</p>
<p>大きく分けると二つの柱があります。</p>
<ul><li><b>価格理論</b>　市場での取引がうまく働く条件と、その限界、そして政府介入の必要性を考えます。</li><li><b>ゲーム理論</b>　少数の当事者が互いの出方を読み合う状況で、何が起きるかを予測し、うまい仕組みを設計します。</li></ul>
<p>また経済学には、現実がなぜそうなっているのかを説明する<b>実証的</b>アプローチと、より良い仕組みを提案する<b>規範的</b>アプローチがあります。この教材では、道路・鉄道・住宅といった身近な題材を使い、この二つを行き来します。</p>
<div class="note"><b>ここが大事</b>　この教材は「市場に任せるべきだ」とも「政府が介入すべきだ」とも主張しません。どの財・サービスについて、どのような条件のときに、どちらがうまく機能するのかを見分ける道具を身につけることが目的です。</div>`,
  quiz: [
    {
      q: "次のうち、経済学の「規範的」なアプローチにあたるものはどれか。",
      choices: [
        "高速道路の料金を引き下げた区間で、交通量が実際にどれだけ増えたかを推計する",
        "都市高速の混雑を緩和するため、混雑時間帯の料金を高くする仕組みを導入すべきだと提案する",
        "住宅価格の推移を長期のデータで整理し、地域ごとの傾向を記述する",
        "鉄道の運賃改定の前後で、利用者数がどのように変化したかを比較する"
      ],
      a: 1,
      why: [
        "×　実際に何が起きたかを数字で推計する作業なので、現実を説明する実証的アプローチにあたります。",
        "○　より良い仕組みを考えて提案しています。あるべき姿を論じるこの立場が規範的アプローチです。",
        "×　データで現状を記述しているだけであり、現実の説明にとどまるため実証的アプローチにあたります。",
        "×　前後の比較で現実の変化を測る作業なので、これも現実を説明する実証的アプローチです。"
      ]
    }
  ]
},
{
  n: 2,
  ch: 1,
  title: "価格と価値はまったく別のもの",
  goal: "取引された価格の高さが、そのものの価値の高さを意味するわけではないと説明できる",
  body: `<p>2017年、レオナルド・ダ・ヴィンチの「サルバトール・ムンディ」が、手数料込みで約510億円で落札されました。ではあなたは、この絵が欲しいでしょうか。ただし転売はできず、家に飾っておくだけです。一生飾る権利と現金1000万円なら、どちらを選びますか。</p>

  body: `<p>売り手の側も、理想的な取引環境では価格を決められません。相場の価格を前提に、そもそも操業するか、するなら<b>どれだけ供給するか</b>を決めます。</p>

/* ================= 状態 ================= */
const KEY="micro100.v1";
let ST={done:{},ans:{},cur:1};
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r);
    ST.done=o.done||{}; ST.ans=o.ans||{}; ST.cur=o.cur||1;}}catch(e){}
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){} }
const doneCount=()=>Object.keys(ST.done).filter(k=>ST.done[k]).length;
const stepOf=n=>STEPS.find(s=>s.n===n);
const chTitle=id=>{const c=CHAPTERS.find(c=>c.id===id);return c?c.title:"";};

/* ================= 描画：ステップ ================= */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const vStep=document.getElementById("viewStep");
const vMap=document.getElementById("viewMap");

function renderStep(n){
  const s=stepOf(n);
  if(!s){vStep.innerHTML='<div class="card"><p>このステップは読み込めませんでした。</p></div>';return;}
  ST.cur=n; save();
  const isDone=!!ST.done[n];
  let h='<article class="card">';
  h+='<div class="st-head"><span class="st-no">STEP '+n+' / '+N+'</span>';
  h+='<span class="st-ch">第'+s.ch+'章　'+esc(chTitle(s.ch))+'</span>';
  h+=(isDone?'<span class="st-done" id="doneChip">✓ 完了</span>':'')+'</div>';
  h+='<h1 class="st-title">'+esc(s.title)+'</h1>';
  h+='<div class="goal"><b>このステップの目標</b><p>'+esc(s.goal)+'</p></div>';
  h+='<div class="body">'+s.body+'</div>';
  /* fig は図のキー1つ、または複数の図を並べたい場合はキーの配列。 */
  if(s.fig){
    [].concat(s.fig).forEach(k=>{
      if(!FIG[k]) return;
      h+='<figure class="figwrap">'+FIG[k]()+
         (FIGCAP[k]?'<figcaption>'+esc(FIGCAP[k])+'</figcaption>':'')+'</figure>';
    });
  }
  const qs=s.quiz||[];
  if(qs.length){
    h+='<section class="quiz"><div class="quiz-h">確認問題</div>';
    qs.forEach((q,qi)=>{
      h+='<div class="q" data-qi="'+qi+'"><p class="q-t">'+(qs.length>1?'（'+(qi+1)+'）':'')+esc(q.q)+'</p><div class="ch-list">';
      q.choices.forEach((c,ci)=>{
        h+='<button class="ch-btn" data-qi="'+qi+'" data-ci="'+ci+'">'+
           '<span class="mk">'+"ABCD"[ci]+'</span><span class="tx">'+esc(c)+'</span></button>'+
           '<div class="why" data-why="'+qi+'-'+ci+'" hidden>'+esc(q.why&&q.why[ci]?q.why[ci]:"")+'</div>';
      });
      h+='</div><div class="q-res" data-res="'+qi+'" hidden></div></div>';
    });
    h+='</section>';
  }
  h+='<div class="nav">';
  h+='<button class="nbtn" id="btnPrev"'+(n<=1?' disabled':'')+'>← 前へ</button>';
  h+='<button class="mark'+(isDone?' on':'')+'" id="btnMark">'+(isDone?'✓ 完了にした':'完了にする')+'</button>';
  h+='<button class="nbtn pri" id="btnNext"'+(n>=N?' disabled':'')+'>'+(n>=N?'最後のステップです':'次へ →')+'</button>';
  h+='</div></article>';
  vStep.innerHTML=h;

  // 既に正解済みの問題は復元表示
  qs.forEach((q,qi)=>{ if(ST.ans[n+"_"+qi]!==undefined) revealQ(n,qi,ST.ans[n+"_"+qi]); });

  vStep.querySelectorAll(".ch-btn").forEach(b=>{
    b.addEventListener("click",()=>answer(n,+b.dataset.qi,+b.dataset.ci));
  });
  document.getElementById("btnPrev").onclick=()=>go(n-1);
  document.getElementById("btnNext").onclick=()=>go(n+1);
  document.getElementById("btnMark").onclick=()=>toggleDone(n);
  updateProgress();
  window.scrollTo({top:0,behavior:"auto"});
}

function answer(n,qi,ci){
  const s=stepOf(n), q=s.quiz[qi];
  const btn=vStep.querySelector('.ch-btn[data-qi="'+qi+'"][data-ci="'+ci+'"]');
  const why=vStep.querySelector('[data-why="'+qi+'-'+ci+'"]');
  const ok=(ci===q.a);
  btn.classList.remove("pick-ok","pick-ng");
  btn.classList.add(ok?"pick-ok":"pick-ng");
  btn.querySelector(".mk").textContent=ok?"✓":"×";
  why.hidden=false; why.className="why "+(ok?"ok":"ng");
  const res=vStep.querySelector('[data-res="'+qi+'"]');
  if(ok){
    ST.ans[n+"_"+qi]=ci; save();
    revealQ(n,qi,ci);
    checkComplete(n);
  }else{
    res.hidden=false; res.className="q-res ng";
    res.textContent="もう一度考えてみましょう。ほかの選択肢も選べます。";
  }
}

function revealQ(n,qi,ci){
  const s=stepOf(n), q=s.quiz[qi];
  q.choices.forEach((c,k)=>{
    const b=vStep.querySelector('.ch-btn[data-qi="'+qi+'"][data-ci="'+k+'"]');
    const w=vStep.querySelector('[data-why="'+qi+'-'+k+'"]');
    if(!b) return;
    b.disabled=true;
    w.hidden=false; w.className="why "+(k===q.a?"ok":"ng");
    if(k===q.a){ b.classList.add("rev-ok"); b.querySelector(".mk").textContent="✓"; }
    else if(k===ci){ b.classList.add("pick-ng"); b.querySelector(".mk").textContent="×"; }
    else { b.style.opacity=".72"; }
  });
  const res=vStep.querySelector('[data-res="'+qi+'"]');
  res.hidden=false; res.className="q-res ok"; res.textContent="正解です。";
}

function checkComplete(n){
  const s=stepOf(n);
  const all=(s.quiz||[]).every((q,qi)=>ST.ans[n+"_"+qi]!==undefined);
  if(all && !ST.done[n]) setDone(n,true);
}

function setDone(n,v){
  const before=doneCount();
  ST.done[n]=v; if(!v) delete ST.done[n];
  save(); updateProgress();
  const b=document.getElementById("btnMark");
  if(b){ b.classList.toggle("on",v); b.textContent=v?"✓ 完了にした":"完了にする"; }
  const head=vStep.querySelector(".st-head");
  let chip=document.getElementById("doneChip");
  if(v && !chip && head){ chip=document.createElement("span"); chip.className="st-done"; chip.id="doneChip";
    chip.textContent="✓ 完了"; head.appendChild(chip); }
  if(!v && chip) chip.remove();
  if(v) milestone(before,doneCount(),n);
}
function toggleDone(n){ setDone(n,!ST.done[n]); }

function milestone(before,after,n){
  if(after<=before) return;
  const s=stepOf(n);
  const chSteps=STEPS.filter(x=>x.ch===s.ch);
  const chDone=chSteps.filter(x=>ST.done[x.n]).length;
  if(after===N){ toast("🎉 全100ステップ達成！　おつかれさまでした。",true); fireworks(); return; }
  if(chDone===chSteps.length){ toast("🏅 第"+s.ch+"章「"+chTitle(s.ch)+"」を完走しました！",true); confetti(); return; }
  if(after%10===0){ toast("✨ "+after+"ステップ達成！　残り "+(N-after)+" です。",true); return; }
}

/* ================= お祝いの演出 =================
   章の完走で紙吹雪、全100ステップ達成で花火。どちらも画面に重ねるだけで
   クリックは下の要素に通す。動きを抑える設定の利用者には表示しない。 */
const fxOff=()=>!!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* 全画面キャンバスを1枚用意する。W・H は CSS ピクセル、描画は端末の解像度に合わせる。 */
function fxCanvas(id){
  const cv=document.createElement("canvas");
  cv.id=id; cv.setAttribute("aria-hidden","true");
  document.body.appendChild(cv);
  const ctx=cv.getContext("2d");
  const o={ctx:ctx,W:0,H:0};
  function size(){
    const d=Math.min(window.devicePixelRatio||1,2);
    o.W=window.innerWidth; o.H=window.innerHeight;
    cv.width=Math.round(o.W*d); cv.height=Math.round(o.H*d);
    cv.style.width=o.W+"px"; cv.style.height=o.H+"px";
    ctx.setTransform(d,0,0,d,0,0);
  }
  size(); window.addEventListener("resize",size);
  o.dispose=function(){ window.removeEventListener("resize",size); cv.remove(); };
  return o;
}

/* ---- 章の完走：紙吹雪 ---- */
function confetti(){
  if(fxOff() || document.getElementById("cfCanvas")) return;
  const fx=fxCanvas("cfCanvas"), ctx=fx.ctx;
  const COLORS=["#F39800","#0095D9","#1F8A5B","#C0392B","#8A6BBF","#E8A400","#38B6E8","#E86A9B"];
  const total=Math.round(Math.min(190,80+fx.W/8));
  const SPAWN=600, SPAN=2600, FADE=900;   // 撒く時間／降る時間／消える時間
  const bits=[];
  let made=0, t0=0, last=0;

  function add(){
    const w=6+Math.random()*6;
    bits.push({x:Math.random()*fx.W, y:-20-Math.random()*140,
      w:w, h:w*(1.2+Math.random()*.9),
      vx:-1+Math.random()*2, vy:4+Math.random()*4,
      rot:Math.random()*6.28, vr:-.14+Math.random()*.28,
      fl:Math.random()*6.28, fv:.09+Math.random()*.12,
      c:COLORS[(Math.random()*COLORS.length)|0]});
  }

  function frame(now){
    if(!t0){ t0=now; last=now; }
    const t=now-t0, k=Math.min(2.4,(now-last)/16.667); last=now;
    ctx.clearRect(0,0,fx.W,fx.H);

    const want=Math.min(total,Math.ceil(total*t/SPAWN));
    while(made<want){ add(); made++; }

    const fade=t<SPAN?1:Math.max(0,1-(t-SPAN)/FADE);
    for(let i=bits.length-1;i>=0;i--){
      const b=bits[i];
      b.x+=b.vx*k+Math.sin((t+b.fl*300)/380)*.7*k;
      b.y+=b.vy*k; b.vy=Math.min(9,b.vy+.03*k);
      b.rot+=b.vr*k; b.fl+=b.fv*k;
      if(b.y>fx.H+40){ bits.splice(i,1); continue; }
      ctx.globalAlpha=fade;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.fillStyle=b.c;
      ctx.fillRect(-b.w/2,-b.h/2,b.w*Math.abs(Math.cos(b.fl))+.6,b.h);   // ひらひら回る紙
      ctx.restore();
    }
    ctx.globalAlpha=1;
    /* 1フレーム目はまだ紙が無いので、撒き終わるまでは枚数を条件にしない。 */
    if(t<SPAN+FADE && (made<total || bits.length)) requestAnimationFrame(frame);
    else fx.dispose();
  }
  requestAnimationFrame(frame);
}

/* ---- 全100ステップ達成：花火 ---- */
function fireworks(duration){
  if(fxOff() || document.getElementById("fwCanvas")) return;
  const fx=fxCanvas("fwCanvas"), ctx=fx.ctx;
  let W=fx.W,H=fx.H;

  /* 配色は教材のパレットから。数字はすべて 1フレーム（約16.7ms）あたりの量。 */
  const COLORS=["#FFB13B","#4FC3F7","#5BD68A","#FF6B6B","#C79BFF","#FFE066","#7FE3E0","#FF8FC7"];
  const SKY=.5;   // 夜空の膜の濃さ
  const pick=a=>a[(Math.random()*a.length)|0];
  const shells=[], parts=[];

  function launch(){
    shells.push({x:W*(.12+Math.random()*.76), y:H+8,
      vy:-(H/95+Math.random()*H/210), c:pick(COLORS)});
  }
  function burst(s){
    const n=76+((Math.random()*40)|0);
    /* 画面が狭いほど開花を小さくして、はみ出さないようにする */
    const S=Math.max(.55,Math.min(1.15,Math.min(W,H*1.3)/900));
    const base=(3.2+Math.random()*2.8)*S;
    const two=Math.random()<.45, c2=pick(COLORS);   // 2色玉
    for(let i=0;i<n;i++){
      const a=Math.PI*2*i/n+Math.random()*.06;
      const r=base*(.55+Math.random()*.55);
      parts.push({x:s.x,y:s.y,vx:Math.cos(a)*r,vy:Math.sin(a)*r,
        l:1, d:.0075+Math.random()*.0075, c:(two&&i%2)?c2:s.c});
    }
    if(parts.length>1800) parts.splice(0,parts.length-1800);   // 端末が重くならないよう上限
  }

  /* 時刻はすべて requestAnimationFrame が渡すタイムスタンプで揃える。 */
  const span=duration||7200, FADE=1800;
  let t0=0, last=0, next=0;

  function frame(now){
    if(!t0){ t0=now; last=now; next=now+120; }
    W=fx.W; H=fx.H;   // リサイズに追従
    const t=now-t0, stop=t0+span;
    const k=Math.min(2.4,(now-last)/16.667); last=now;
    ctx.clearRect(0,0,W,H);

    /* 夜空の膜。打ち上げの前後でなめらかに出入りさせる。 */
    const a=SKY*(t<400 ? t/400 : (t<span ? 1 : Math.max(0,1-(t-span)/FADE)));
    if(a>0){ ctx.globalAlpha=1; ctx.fillStyle="rgba(12,20,46,"+a.toFixed(3)+")"; ctx.fillRect(0,0,W,H); }

    /* 膜は半透明なので、加算合成にすると色が白へ飛ぶ。通常合成のまま描く。 */
    ctx.lineCap="round";

    if(now<stop && now>=next){
      launch(); if(Math.random()<.45) launch();
      next=now+130+Math.random()*220;
    }
    for(let i=shells.length-1;i>=0;i--){
      const s=shells[i];
      s.y+=s.vy*k; s.vy+=.13*k;
      ctx.globalAlpha=.95; ctx.strokeStyle=s.c; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(s.x,s.y-s.vy*3.2); ctx.lineTo(s.x,s.y); ctx.stroke();
      if(s.vy>=-.6){ burst(s); shells.splice(i,1); }   // 頂点で開く
    }
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx*k; p.y+=p.vy*k; p.vy+=.055*k;
      const drag=Math.pow(.985,k); p.vx*=drag; p.vy*=drag;
      p.l-=p.d*k;
      if(p.l<=0){ parts.splice(i,1); continue; }
      ctx.globalAlpha=Math.min(1,p.l*1.25); ctx.strokeStyle=p.c; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(p.x-p.vx*2.2,p.y-p.vy*2.2); ctx.lineTo(p.x,p.y); ctx.stroke();
    }
    ctx.globalAlpha=1;

    if(t<span+FADE || shells.length || parts.length){ requestAnimationFrame(frame); }
    else fx.dispose();
  }
  requestAnimationFrame(frame);
}

let toastT=null;
function toast(msg,gold){
  const el=document.getElementById("toast");
  el.textContent=msg; el.className="toast show"+(gold?" gold":"");
  clearTimeout(toastT); toastT=setTimeout(()=>{el.className="toast"+(gold?" gold":"");},3600);
}

function updateProgress(){
  const d=doneCount(), p=Math.round(d/N*100);
  document.getElementById("pDone").textContent=d;
  document.getElementById("pPct").textContent=p;
  document.getElementById("barIn").style.width=p+"%";
}

/* ================= 描画：一覧 ================= */
function renderMap(){
  let h='<div class="card"><h2 class="mp-h">学習の全体マップ</h2>';
  h+='<p class="mp-sub">100個のマスが100のステップです。マスをクリックするとそのステップに移動します。</p>';
  h+='<div class="grid">';
  const chStart={};
  CHAPTERS.forEach(c=>{ const f=STEPS.find(s=>s.ch===c.id); if(f) chStart[f.n]=1; });
  STEPS.forEach(s=>{
    const cls=["cell"];
    if(ST.done[s.n]) cls.push("done");
    if(s.n===ST.cur) cls.push("cur");
    if(chStart[s.n]) cls.push("chs");
    h+='<button class="'+cls.join(" ")+'" data-n="'+s.n+'" title="'+esc("STEP "+s.n+"　"+s.title)+'">'+s.n+'</button>';
  });
  h+='</div>';
  h+='<div class="lgd"><span><i style="background:var(--primary)"></i>完了</span>'+
     '<span><i style="background:var(--border-soft)"></i>未了</span>'+
     '<span><i style="background:#fff;box-shadow:inset 2px 0 0 var(--accent),inset 0 0 0 1px var(--border)"></i>章のはじまり</span>'+
     '<span><i style="background:#fff;border:1.5px solid var(--accent)"></i>現在地</span></div>';
  h+='<div class="chs-list">';
  CHAPTERS.forEach(c=>{
    const ss=STEPS.filter(s=>s.ch===c.id);
    const d=ss.filter(s=>ST.done[s.n]).length;
    const pct=ss.length?Math.round(d/ss.length*100):0;
    const first=ss.length?ss[0].n:1;
    h+='<button class="chrow'+(d===ss.length&&ss.length?" full":"")+'" data-n="'+first+'">'+
       '<span class="cn">第'+c.id+'章</span><span class="ct">'+esc(c.title)+'</span>'+
       '<span class="cb"><i style="width:'+pct+'%"></i></span>'+
       '<span class="cc">'+d+'/'+ss.length+'</span></button>';
  });
  h+='</div>';
  h+='<div class="mp-foot"><span class="mini">進み具合はこのブラウザに自動保存されています。</span>'+
     '<button class="danger" id="btnReset">進捗をすべて消す</button></div>';
  h+='</div>';
  vMap.innerHTML=h;
  vMap.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>{ showStep(); go(+b.dataset.n); }));
  document.getElementById("btnReset").onclick=askReset;
}

function askReset(){
  const f=document.querySelector(".mp-foot");
  f.innerHTML='<span class="mini" style="color:var(--ng);font-weight:700">本当にすべての進捗を消しますか？</span>'+
    '<button class="danger" id="rYes">はい、消します</button>'+
    '<button class="nbtn" id="rNo" style="padding:.3rem .8rem;font-size:.76rem">やめる</button>';
  document.getElementById("rYes").onclick=()=>{
    ST={done:{},ans:{},cur:1}; save(); updateProgress(); renderMap(); toast("進捗をリセットしました。");
  };
  document.getElementById("rNo").onclick=renderMap;
}

/* ================= 画面切り替え ================= */
function showStep(){ vStep.hidden=false; vMap.hidden=true; document.getElementById("btnMap").classList.remove("on"); }
function showMap(){ renderMap(); vStep.hidden=true; vMap.hidden=false;
  document.getElementById("btnMap").classList.add("on"); window.scrollTo({top:0,behavior:"auto"}); }
function go(n){ if(n<1||n>N) return; showStep(); renderStep(n); history.replaceState(null,"","#step"+n); }

document.getElementById("btnMap").onclick=()=>{ if(vMap.hidden) showMap(); else showStep(); };
document.getElementById("btnResume").onclick=()=>go(ST.cur||1);
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(!vMap.hidden){ if(e.key==="Escape"){showStep();} return; }
  if(e.key==="ArrowLeft"){ go(ST.cur-1); }
  else if(e.key==="ArrowRight"){ go(ST.cur+1); }
});

/* ================= 起動 ================= */
load();
updateProgress();
const m=location.hash.match(/^#step(\d+)$/);
renderStep(m?Math.min(Math.max(+m[1],1),N):(ST.cur||1));
</script>
